<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo List</title>
    </head>
    <body>
        <section class="header">
            <h2>Thingies</h2>
        </section>

        <!--After every click, dynamically renders page. No "routing".-->
        <section class="sidebar">
            <section class="nav">
                <h2>Navigation</h2>
                <div id="nav-pending">
                    <img id="pending-icon" />
                    <span>Pending</span>
                </div>
                <div id="nav-completed">
                    <img id="completed-icon" />
                    <span>Completed</span>
                </div>
                <div id="nav-deleted">
                    <img id="deleted-icon" />
                    <span>Deleted</span>
                </div>
            </section>

            <section class="projects">
                <div class="projects-header">
                    <h2>Projects</h2>
                    <button id="addproject">+</button>
                </div>

                <div id="project-list"></div>
            </section>
        </section>

        <!--Will come back to this later, not sure how to control state in vanilla JS-->
        <section id="main">
            <h2 id="content-header">This is my main content section</h2>

            <div id="task-create-form">
                <form>
                    <!-- Todo Title -->
                    <label for="todo_title">TODO Title: </label>
                    <input
                        type="text"
                        id="todo_title"
                        name="name"
                        placeholder="Enter your name"
                    />

                    <!-- Todo Description -->
                    <label for="todo_description">TODO Description: </label>
                    <input
                        type="text"
                        id="todo_description"
                        name="description"
                        placeholder="Enter the description"
                    />

                    <!-- Todo Due Date -->
                    <label for="todo_dueDate">TODO Due Date: </label>
                    <input
                        type="text"
                        id="todo_dueDate"
                        name="dueDate"
                        placeholder="Enter the due date"
                    />

                    <!-- Priority Dropdown -->
                    <label for="priority">Priority: </label>
                    <select id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>

                    <!-- Status Dropdown -->
                    <label for="status">Status: </label>
                    <select id="status" name="status">
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="deleted">Deleted</option>
                    </select>
                </form>
            </div>

            <!-- Submit -->
            <button type="submit">Submit</button>

            <div id="task-list"></div>
        </section>

        <section class="footer">
            <p>Hope you enjoyed the project! By Adrian Diaz.</p>
        </section>
    </body>
</html>
