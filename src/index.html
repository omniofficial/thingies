<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo List</title>
    </head>
    <body>
        <section class="header">
            <h2>Thingies</h2>
        </section>

        <!--After every click, dynamically renders page. No "routing".-->
        <section class="sidebar">
            <section class="nav">
                <h2>Navigation</h2>
                <div id="nav-pending">
                    <img id="pending-icon" />
                    <span>Pending</span>
                </div>
                <div id="nav-completed">
                    <img id="completed-icon" />
                    <span>Completed</span>
                </div>
                <div id="nav-deleted">
                    <img id="deleted-icon" />
                    <span>Deleted</span>
                </div>
            </section>

            <section class="projects">
                <div class="projects-header">
                    <h2>Projects</h2>
                    <button id="addproject">+</button>
                </div>

                <div id="project-list"></div>
            </section>
        </section>

        <section id="main">
            <div id="main-content"></div>
        </section>

        <section class="footer">
            <p>Hope you enjoyed the project! By Adrian Diaz.</p>
        </section>
    </body>
</html>
